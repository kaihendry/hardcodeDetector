repos:
  # For CDK projects: synth first, then lint
  # Templates are generated in cdk.out/ (gitignored), so we need a local hook
  - repo: local
    hooks:
      - id: cdk-synth-and-lint
        name: CDK synth + cfn-lint hardcoded names
        entry: bash -c 'uv run cdk synth -q 2>/dev/null && uv run cfn-lint'
        language: system
        pass_filenames: false
        files: \.(py|json)$

  # For non-CDK projects with committed CloudFormation templates:
  # Use the official cfn-lint hook directly
  # - repo: https://github.com/aws-cloudformation/cfn-lint
  #   rev: v1.43.4
  #   hooks:
  #     - id: cfn-lint
  #       args: ['-a', 'cfn_lint_rules/']
  #       files: \.template\.(json|yaml|yml)$
