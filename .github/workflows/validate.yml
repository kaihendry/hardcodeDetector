name: Validate CDK (Detect Hardcoded Names)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CDK_DISABLE_CLI_TELEMETRY: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: CDK Synth (shows hardcoded name warnings)
        run: uv run cdk synth
