AWSTemplateFormatVersion: '2010-09-09'
Description: GOOD - Names use intrinsic functions/parameters (should pass)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:
  # S3 Bucket - name from Fn::Sub with parameter
  MyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-data-${Environment}'

  # DynamoDB Table - name from Fn::Sub
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-users'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # SQS Queue - name from Fn::Join
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Join
        - '-'
        - - !Ref AWS::StackName
          - processing
          - !Ref Environment

  # SNS Topic - name from Ref to parameter
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'alerts-${Environment}'

  # Lambda Function - name from Fn::Sub
  ProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-processor'
      Runtime: python3.11
      Handler: index.handler
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200}
      Role: !GetAtt LambdaRole.Arn

  # IAM Role - name from Fn::Sub
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  # Secrets Manager Secret - name from Fn::Sub
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/database/credentials'
      Description: Database credentials

  # CloudWatch Log Group - name from Fn::Sub
  AppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/app/${AWS::StackName}/${Environment}/logs'
      RetentionInDays: 30
